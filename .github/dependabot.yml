
version: 2

updates:
  # C#, Avalonia, SkiaSharp, and other NuGet packages
  - package-ecosystem: "nuget"
    directories:
      - "/src/*"
      - "/tests/*"
      - "/tools/*"

    schedule:
      interval: "weekly"

    open-pull-requests-limit: 10

    # Keep the managed and native Skia packages aligned with Avalonia.Skia.
    # Review version bumps together when updating Avalonia; this rule is for
    # routine version updates, not security updates.
    ignore:
      - dependency-name: "SkiaSharp"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "SkiaSharp.NativeAssets.Win32"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"

    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"

    schedule:
      interval: "weekly"

    open-pull-requests-limit: 5

    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
